name: Sky Carrier verify

# Roblox Studio を開かずに、ゲームロジックの純関数部分
# (Config / FlightModel / Mission / AntiCheat) を Luau CLI で実行して検証する。
# 離着陸判定・失速・燃料切れ・高度上限・クライアント予測との決定性の一致・
# ミッション報酬の計算式・不正な移動申告の拒否など 116 項目
# (roblox/sky-carrier/verify.luau)。
on:
  push:
    paths:
      - "roblox/sky-carrier/**"
      - ".github/workflows/sky-carrier-verify.yml"
  pull_request:
    paths:
      - "roblox/sky-carrier/**"
      - ".github/workflows/sky-carrier-verify.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luau CLI
        run: |
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -q luau.zip -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/luau" "$RUNNER_TEMP/luau/luau-compile"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"

      - name: Syntax check every Luau source
        run: |
          set -e
          find roblox/sky-carrier -name "*.luau" -print0 \
            | xargs -0 -n1 luau-compile --binary > /dev/null

      - name: Run logic verifier
        working-directory: roblox/sky-carrier
        run: luau verify.luau
