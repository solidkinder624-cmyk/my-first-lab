name: GRAZE & GRACE verify

# ブラウザを開かずに、games/graze-and-grace/ の弾幕壁生成 / シールド / スコア計算 /
# 拍クロックの純粋ロジック(core.js・score.js・rhythm.js)を Node で検証する
# (games/graze-and-grace/verify.mjs、65項目)。DOM/AudioContext に依存しない
# 部分だけを対象にしているので、ブラウザなしで壊れをすぐ検知できる。
on:
  push:
    paths:
      - "games/graze-and-grace/**"
      - ".github/workflows/graze-and-grace-verify.yml"
  pull_request:
    paths:
      - "games/graze-and-grace/**"
      - ".github/workflows/graze-and-grace-verify.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run logic verifier
        run: node games/graze-and-grace/verify.mjs
